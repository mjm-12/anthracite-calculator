<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzz Face OP</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app">
        <div class="col col-l">
            <figure class="schematic">
                <img id="schematic" src="schematic_o12.svg" alt="Fuzz Face schematic">
            </figure>

            <form class="inputs" id="inputs" autocomplete="off" onsubmit="return false">
                <fieldset class="seg">
                    <label title="Alt+1"><input type="radio" name="mode" value="forward" checked><span>I<sub>C</sub> → R</span></label>
                    <label title="Alt+2"><input type="radio" name="mode" value="reverse"><span>R → I<sub>C</sub></span></label>
                </fieldset>

                <div class="fields">
                    <label for="vcc">V<sub>CC</sub></label><input id="vcc" value="9" data-step="0.5" autofocus><span class="u">V</span>
                    <label for="rf">R<sub>F</sub></label><input id="rf" value="100k" data-step="e24"><span class="u">Ω</span>
                    <label for="rv1">RV<sub>1</sub></label>
                    <select id="rv1">
                        <option value="0.1">0.1</option>
                        <option value="1" selected>1</option>
                        <option value="10">10</option>
                        <option value="100">100</option>
                        <option value="1k">1k</option>
                        <option value="10k">10k</option>
                        <option value="Infinity">∞</option>
                    </select><span class="u">Ω</span>
                    <label for="rv2">RV<sub>2</sub></label>
                    <select id="rv2">
                        <option value="100k">100k</option>
                        <option value="250k">250k</option>
                        <option value="500k" selected>500k</option>
                        <option value="1M">1M</option>
                        <option value="Infinity">∞</option>
                    </select><span class="u">Ω</span>
                    <label for="rin">R<sub>in</sub></label><input id="rin" value="1k" data-step="e24" title="source impedance"><span class="u">Ω</span>
                    <label for="vt">V<sub>T</sub></label><input id="vt" value="25.85m" data-step="0.1m"><span class="u">V</span>
                </div>

                <div class="fields mode-forward">
                    <label for="ic1">I<sub>C1</sub></label><input id="ic1" value="50u" data-step="e24"><span class="u">A</span>
                    <label for="ic2">I<sub>C2</sub></label><input id="ic2" value="500u" data-step="e24"><span class="u">A</span>
                    <label for="vr-ratio" id="ratio-label">V<sub>R</sub>:V<sub>C</sub></label>
                    <span class="pair ratio"><button type="button" class="seg2" id="rf-mode" aria-pressed="false" aria-label="R_F / V_E" title="R_F input / V_E ratio (Alt+3)"><span>R<sub>F</sub></span><span>V<sub>E</sub></span></button><input id="vr-ratio" value="1" data-step="0.1"><i>:</i><input id="vc-ratio" value="1" data-step="0.1" aria-label="VC ratio"><i class="ve-part" hidden>:</i><input id="ve-ratio" class="ve-part" value="0.2" data-step="0.1" aria-label="VE ratio" hidden></span><span class="u"></span>
                </div>

                <div class="fields mode-reverse" hidden>
                    <label for="r1">R<sub>1</sub></label><input id="r1" value="150k" data-step="e24"><span class="u">Ω</span>
                    <label for="r2">R<sub>2</sub></label><input id="r2" value="8.2k" data-step="e24"><span class="u">Ω</span>
                    <label for="r3">R<sub>3</sub></label><input id="r3" value="1.1k" data-step="e24"><span class="u">Ω</span>
                </div>

                <div class="fields opt">
                    <label for="rbc1">R<sub>BC1</sub></label><span class="pair bc"><button type="button" class="open" id="rbc1-open" aria-pressed="true" aria-label="R_BC1 open" title="R_BC1 open (∞)">OPEN</button><input id="rbc1" class="off" value="" placeholder="∞" data-step="e24" readonly></span><span class="u">Ω</span>
                    <label for="rbc2">R<sub>BC2</sub></label><span class="pair bc"><button type="button" class="open" id="rbc2-open" aria-pressed="true" aria-label="R_BC2 open" title="R_BC2 open (∞)">OPEN</button><input id="rbc2" class="off" value="" placeholder="∞" data-step="e24" readonly></span><span class="u">Ω</span>
                </div>
            </form>
        </div>

        <div class="col col-r">
            <section class="results" id="results" aria-live="polite">
                <div class="status" id="status"></div>
                <div id="out"></div>
            </section>

            <div class="models" id="models">
                <div class="model">
                    <div class="mhead"><label for="q1-model">Q<sub>1</sub></label><button type="button" class="open" id="q1-param" title="edit SPICE parameters of Q1">param</button></div>
                    <textarea id="q1-model" rows="3" spellcheck="false">.MODEL 2SC8888-W NPN(IS=25.44f BF=380.43 NF=1.002 VAF=125.5 IKF=385m ISE=4.88f NE=1.35 BR=8.22 NR=1.01 VAR=18.5 IKR=180m ISC=32.5f NC=1.25 RB=12.8 IRB=50u RBM=2 RE=185m RC=880m CJE=15.32p VJE=0.75 MJE=0.34 CJC=5.12p VJC=0.55 MJC=0.32 FC=0.5 TF=445p XTF=8 VTF=12 ITF=300m TR=65n EG=1.11 XTI=3 XTB=1.5 Vceo=60 Icrating=150m mfg=virtual-transistor)</textarea>
                    <output class="parsed" id="q1-parsed"></output>
                </div>
                <div class="model">
                    <div class="mhead"><label for="q2-model">Q<sub>2</sub></label><button type="button" class="open" id="q2-param" title="edit SPICE parameters of Q2">param</button></div>
                    <textarea id="q2-model" rows="3" spellcheck="false">.MODEL 2SC8888-W NPN(IS=25.44f BF=380.43 NF=1.002 VAF=125.5 IKF=385m ISE=4.88f NE=1.35 BR=8.22 NR=1.01 VAR=18.5 IKR=180m ISC=32.5f NC=1.25 RB=12.8 IRB=50u RBM=2 RE=185m RC=880m CJE=15.32p VJE=0.75 MJE=0.34 CJC=5.12p VJC=0.55 MJC=0.32 FC=0.5 TF=445p XTF=8 VTF=12 ITF=300m TR=65n EG=1.11 XTI=3 XTB=1.5 Vceo=60 Icrating=150m mfg=virtual-transistor)</textarea>
                    <output class="parsed" id="q2-parsed"></output>
                </div>
            </div>

            <div class="csvbar">
                <button type="button" class="open" id="csv-in" title="CSV import (Ctrl+O / drop a .csv)">import</button>
                <button type="button" class="open" id="csv-out" title="CSV export (Ctrl+S)">export</button>
                <button type="button" class="open" id="xfer" title="transfer result to the other mode (Ctrl+Enter)" disabled>→ R→I<sub>C</sub></button>
                <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
            </div>
        </div>
    </main>

    <dialog id="pdlg" aria-labelledby="ptitle">
        <form id="pform" method="dialog" autocomplete="off">
            <div class="ptitle" id="ptitle">Q<sub>1</sub></div>
            <div class="pgrid" id="pgrid"></div>
            <div class="pbtns">
                <button type="button" class="open" id="pcopy">copy Q2</button>
                <span class="perr" id="perr"></span>
                <button type="button" class="open" id="pcancel" title="Esc">cancel</button>
                <button type="submit" class="open" id="papply" title="Enter">apply</button>
            </div>
        </form>
    </dialog>

    <script src="js/utils.js"></script>
    <script src="js/spice-parser.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
