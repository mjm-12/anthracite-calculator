<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthracite Calc · bode</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bodepage">
    <main class="bode-pane">
        <div class="bhead">
            <div class="bfields">
                <label for="fstart">f</label><span class="pair"><input id="fstart" value="10" data-step="e24"><i>–</i><input id="fstop" value="1M" data-step="e24" aria-label="f stop"></span><span class="u">Hz</span>
            </div>
            <button type="button" class="open" id="bsweep" aria-pressed="false" title="RV1 sweep 1 Ω … 10 kΩ (Alt+R)">RV<sub>1</sub> sweep</button>
            <span class="bsrc">
                <select id="bsrc" aria-label="signal source" title="signal source for the Bode / stability views">
                    <option value="r">R_in</option>
                    <option value="texasSpecialNeck">Texas Special Neck</option>
                    <option value="gibson57ClassicNeck">57 Classic Neck</option>
                </select>
                <span class="bknobs" id="bknobs" hidden><label>Vol <input id="bvol" value="10" data-step="1" data-min="0" data-max="10" aria-label="volume knob 0-10"></label><label>Tone <input id="btone" value="10" data-step="1" data-min="0" data-max="10" aria-label="tone knob 0-10"></label></span>
            </span>
            <button type="button" class="seg2" id="bview" aria-pressed="false" title="Bode / stability (Alt+T)"><span>bode</span><span>stability</span></button>
            <div class="bsum" id="bsum"></div>
            <button type="button" class="open" id="bexport" title="export the plotted data as CSV (Ctrl+S)">export</button>
        </div>
        <div class="bmsg" id="bmsg"></div>
        <svg id="bplot" role="img" aria-label="|A_vs| and phase vs frequency"></svg>
        <div class="bstab" id="bstab" hidden></div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/spice-parser.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/bode-plot.js"></script>
    <script src="js/bode-app.js"></script>
</body>

</html>
